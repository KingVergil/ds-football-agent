<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三角色参数对比 · 雷达图</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root { --bg: #f0f4f8; --card: #ffffff; --text: #1e293b; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 40px;
  }
  .card {
    background: var(--card); border: 1px solid #30363d; border-radius: 12px;
    padding: 32px; width: 100%; max-width: 700px;
  }
  h2 { text-align: center; margin-bottom: 8px; color: #1e293b; font-size: 1.2em; }
  .sub { text-align: center; color: #64748b; font-size: 0.8em; margin-bottom: 24px; }
  canvas { max-width: 100%; }
  .legend { display: flex; justify-content: center; gap: 24px; margin-top: 16px; font-size: 0.85em; color: #1e293b; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div class="card">
  <h2>🎭 三角色参数对比</h2>
  <p class="sub">归一化 0-1 · 1 = 激进/强依赖/高容忍</p>
  <canvas id="radar"></canvas>
  <div class="legend">
    <span><span class="dot" style="background:#3fb950"></span> 跟屁狗</span>
    <span><span class="dot" style="background:#f85149"></span> 疯狗</span>
    <span><span class="dot" style="background:#58a6ff"></span> 蓝猫</span>
  </div>
</div>

<script>
new Chart(document.getElementById('radar'), {
  type: 'radar',
  data: {
    labels: ['单笔仓位', '止损严格度', '因子依赖', '回撤容忍', '命中率'],
    datasets: [
      {
        label: '跟屁狗 · 趋势跟随型',
        data: [0.45, 0.40, 0.25, 0.50, 0.46],
        borderColor: '#3fb950',
        backgroundColor: 'rgba(63,185,80,0.10)',
        borderWidth: 2,
        pointRadius: 4,
        pointBackgroundColor: '#3fb950',
      },
      {
        label: '疯狗 · 激进型',
        data: [0.85, 0.80, 0.15, 0.25, 0.64],
        borderColor: '#f85149',
        backgroundColor: 'rgba(248,81,73,0.08)',
        borderWidth: 2,
        pointRadius: 4,
        pointBackgroundColor: '#f85149',
      },
      {
        label: '蓝猫 · 因子驱动型',
        data: [0.15, 0.60, 0.95, 0.70, 0.81],
        borderColor: '#58a6ff',
        backgroundColor: 'rgba(88,166,255,0.10)',
        borderWidth: 2,
        pointRadius: 4,
        pointBackgroundColor: '#58a6ff',
      },
    ]
  },
  options: {
    responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      r: {
        beginAtZero: true, max: 1,
        ticks: { stepSize: 0.2, color: '#64748b', backdropColor: 'transparent', font: { size: 10 } },
        pointLabels: { color: '#1e293b', font: { size: 13 } },
        grid: { color: '#e2e8f0' },
        angleLines: { color: '#e2e8f0' },
      }
    }
  }
});
</script>
</body>
</html>
