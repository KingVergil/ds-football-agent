<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e1e4e8;padding:10px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.topbar h1{font-size:17px;color:#f0f6fc}
.topbar button{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.topbar button:hover,.topbar button.on{background:#30363d;color:#f0f6fc}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:1200px){.grid{grid-template-columns:1fr}}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;overflow:hidden}
.card-head{padding:10px 14px 8px;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:12px}
.card-head h2{font-size:14px;white-space:nowrap;min-width:70px}
.card-head .nums{flex:1}
.card-head .cap{font-size:20px;font-weight:700}
.card-head .meta{font-size:11px;color:#8b949e}
.win{color:#f85149}.lose{color:#3fb950}.push{color:#8b949e}.pend{color:#d29922}.muted{color:#8b949e}

/* hide-money mode */
body.hide-money .money{display:none}

/* chart */
.chart-wrap{padding:4px 14px 6px;border-bottom:1px solid #21262d}
.chart-wrap svg{display:block}

.card-body{max-height:360px;overflow-y:auto}
.section-label{font-size:11px;color:#8b949e;padding:6px 14px 2px;background:#0d1117;border-bottom:1px solid #21262d}
.card-body table{width:100%;border-collapse:collapse;font-size:11px}
.card-body th{text-align:left;padding:3px 8px;background:#0d1117;color:#8b949e;font-weight:500;position:sticky;top:0;z-index:1}
.card-body td{padding:2px 8px;border-bottom:1px solid #1c2128;white-space:nowrap}
.card-body tr:hover td{background:#1a1f28}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bar-wrap{width:32px;height:4px;background:#21262d;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:2px}
.bar-fill{height:100%;border-radius:2px;background:#58a6ff}
.empty{color:#8b949e;text-align:center;padding:16px;font-size:12px}
.topbar{flex-wrap:wrap}
.topbar #filters{display:inline-flex;flex-wrap:wrap;gap:6px;margin-left:4px}
.fbtn{font-size:11px!important;padding:3px 9px!important}
#ranking{max-width:680px}
.rank-title{font-size:14px;color:#f0f6fc;margin:4px 0 10px;font-weight:600}
.rank-table{width:100%;border-collapse:collapse;font-size:13px;background:#161b22;border:1px solid #30363d;border-radius:10px;overflow:hidden}
.rank-table th{text-align:left;padding:8px 12px;background:#0d1117;color:#8b949e;font-weight:500;font-size:11px}
.rank-table td{padding:8px 12px;border-bottom:1px solid #1c2128}
.rank-table tbody tr:last-child td{border-bottom:none}
.rank-table tr:hover td{background:#1a1f28}
.rank-table .rk{color:#8b949e;font-variant-numeric:tabular-nums;width:28px}
.rank-table tbody tr:first-child .rk{color:#e3b341;font-weight:700}
.rank-btn{font-size:11px;padding:3px 9px;margin-left:4px;background:#21262d;border:1px solid #30363d;color:#8b949e;border-radius:4px;cursor:pointer}
.rank-btn:hover{background:#30363d}
.rank-btn.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
/* 单个 agent 放大 */
body.single-agent .card-head h2{font-size:18px}
body.single-agent .card-head .cap{font-size:26px}
body.single-agent .card-head .meta{font-size:13px}
body.single-agent .section-label{font-size:13px}
body.single-agent .card-body table{font-size:14px}
body.single-agent .card-body td{padding:4px 10px}
body.single-agent .card-body th{padding:5px 10px;font-size:12px}
body.single-agent .card-body{max-height:600px}

/* 7.11 累计统计面板 */
.cumul-panel{margin:0 0 20px;padding:16px 22px;background:#0d1117;border:1px solid #30363d;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.cumul-panel h3{font-size:15px;margin:0 0 10px;color:#e6edf3}
.cumul-table{width:100%;border-collapse:collapse;font-size:13px}
.cumul-table th,.cumul-table td{padding:4px 10px;text-align:right;white-space:nowrap}
.cumul-table th{font-size:11px;color:#8b949e;font-weight:500;border-bottom:1px solid #21262d}
.cumul-table td{color:#c9d1d9}
.cumul-table td.name{text-align:left;font-weight:600}
.cumul-table tr.total td{font-weight:700;border-top:1px solid #30363d;color:#e6edf3}
.cumul-table .pos{color:#3fb950}.cumul-table .neg{color:#f85149}

</style>
</head>

// ── 足球日: 当日12:01 → 次日12:00。按比赛开赛时间归日 ──
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function footballDay(t){
  if(!t) return '';
  const dt = new Date(String(t).replace(' ','T'));
  if(isNaN(dt)) return '';
  const d = new Date(dt);
  if(dt.getHours()*60+dt.getMinutes() < 12*60+1) d.setDate(d.getDate()-1); // 12:00前算前一足球日
  return fmtDate(d);
}
// 昨日足球日 = 日历昨天，覆盖窗口 [昨日12:01, 今日12:00]
// (足球日 D 定义为 [D 12:01, D+1 12:00]，所以「昨日」= 日历今天减一天)
const _yFD = new Date(); _yFD.setDate(_yFD.getDate()-1);
const yesterdayFD = fmtDate(_yFD);
// 本周 = 过去7个足球日（从6天前到昨天）
const _wStart = new Date(); _wStart.setDate(_wStart.getDate()-7);
const weekStartFD = fmtDate(_wStart);

function toggleMoney(){
  const btn = document.getElementById('toggleMoney');
  const hide = document.body.classList.toggle('hide-money');
  btn.textContent = hide ? '🙉 显示金额' : '🙈 隐藏金额';
  btn.classList.toggle('on', hide);
}

function icn(hit){
  if(hit===true) return'<span class="win">✅</span>';
  if(hit===false)return'<span class="lose">❌</span>';
  if(hit===null||hit===undefined) return'<span class="pend">⏳</span>';
  return'<span class="push">➖</span>';
}
function pnlCell(v){
  if(v==null) return'<span class="pend">—</span>';
  const cls=v>0?'win':v<0?'lose':'push', sign=v>0?'+':'';
  return`<span class="${cls} num money">${sign}${v.toFixed(0)}</span>`;
}

// ── SVG 迷你资金曲线 ──
function drawCurve(points, width, height){
  if(!points || points.length<2) return '';
  const pad = {top:6, right:12, bottom:14, left:40};
  const w = width - pad.left - pad.right;
  const h = height - pad.top - pad.bottom;
  const vals = points.map(p=>p.capital);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max-min || 1;
  const xs = points.map((_,i)=>pad.left + (i/(points.length-1))*w);
  const ys = vals.map(v=>pad.top + (1-(v-min)/range)*h);
  const pts = xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const areaPts = `${xs[0].toFixed(1)},${pad.top+h} ` + xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ') + ` ${xs[xs.length-1].toFixed(1)},${pad.top+h}`;

  const color = vals[vals.length-1]>=vals[0]?'#f85149':'#3fb950';
  const lastY = ys[ys.length-1];

  return `<svg width="${width}" height="${height}" style="display:block">
    <!-- grid lines -->
    <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top+h}" stroke="#21262d" stroke-width="1"/>
    <line x1="${pad.left}" y1="${pad.top+h}" x2="${pad.left+w}" y2="${pad.top+h}" stroke="#21262d" stroke-width="1"/>
    <!-- area -->
    <polygon points="${areaPts}" fill="${color}" opacity="0.08"/>
    <!-- line -->
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/>
    <!-- end dot -->
    <circle cx="${xs[xs.length-1].toFixed(1)}" cy="${lastY.toFixed(1)}" r="3" fill="${color}"/>
    <!-- y-axis labels: min & max -->
    <text x="${pad.left-3}" y="${pad.top+12}" fill="#8b949e" font-size="9" text-anchor="end">${max.toLocaleString(undefined,{maximumFractionDigits:0})}</text>
    <text x="${pad.left-3}" y="${pad.top+h-2}" fill="#8b949e" font-size="9" text-anchor="end">${min.toLocaleString(undefined,{maximumFractionDigits:0})}</text>
    <!-- x-axis: first & last date -->
    <text x="${xs[0].toFixed(1)}" y="${pad.top+h+12}" fill="#8b949e" font-size="8" text-anchor="start">${points[0].date.slice(5)}</text>
    <text x="${xs[xs.length-1].toFixed(1)}" y="${pad.top+h+12}" fill="#8b949e" font-size="8" text-anchor="end">${points[points.length-1].date.slice(5)}</text>
  </svg>`;
}

const agents = [...new Set(data.map(d=>d.agent))];
let html='';
const agentStats=[];

agents.forEach(a=>{
  const ds = data.filter(d=>d.agent===a);
  if(!ds.length) return;
  const cap = ds[0].capital;
  const settled = ds.filter(d=>d.settled);
  const pend = ds.filter(d=>!d.settled);
  const total = settled.length;
  // 命中率: 去掉走水(profit=0)，赢半算赢/输半算输，即按盈亏正负分类 wins/(wins+losses)
  const wins = settled.filter(d=>(d.profit||0)>0).length;
  const losses = settled.filter(d=>(d.profit||0)<0).length;
  const decided = wins + losses;
  const pnl = settled.reduce((s,d)=>s+(d.profit||0),0);
  const hitRate = decided>0?(wins/decided*100).toFixed(0):'-';
  const roi = total>0?(pnl/(cap-pnl)*100).toFixed(1):'0.0';
  // 昨日ROI = 昨日足球日已结算单的 PnL / 注金
  const ySettled = settled.filter(d=>footballDay(d.time)===yesterdayFD);
  const yPnl = ySettled.reduce((s,d)=>s+(d.profit||0),0);
  const yBet = ySettled.reduce((s,d)=>s+(d.bet_size||0),0);
  const yRoi = yBet>0 ? (yPnl/yBet*100) : null;
  const yCls = yRoi>0?'win':yRoi<0?'lose':'push';
  // 本周 = 过去7个足球日
  const wSettled = settled.filter(d=>footballDay(d.time)>=weekStartFD && footballDay(d.time)<=yesterdayFD);
  const wPnl = wSettled.reduce((s,d)=>s+(d.profit||0),0);
  const wBet = wSettled.reduce((s,d)=>s+(d.bet_size||0),0);
  const wRoi = wBet>0 ? (wPnl/wBet*100) : null;
  const wCls = wRoi>0?'win':wRoi<0?'lose':'push';
  const yRoiHtml = yRoi!=null
    ? ` · 昨日ROI(${yesterdayFD.slice(5)}) <span class="${yCls}">${yRoi>=0?'+':''}${yRoi.toFixed(1)}%</span> <span class="${yCls} money">${yPnl>=0?'+':''}${yPnl.toFixed(0)}</span><span class="muted money" style="font-size:11px"> /注${yBet.toFixed(0)}</span>`
    : ` · <span class="muted" style="font-size:11px">昨日(${yesterdayFD.slice(5)})无单</span>`;
  const pendingTotal = pend.reduce((s,d)=>s+(d.bet_size||0),0);
  const totalExposure = cap + pendingTotal;
  const curve = curves[a] || [];

  function renderTable(list, isPending){
    if(!list.length) return '';
    const sorted = [...list].sort((a,b)=>(b.time||'').localeCompare(a.time||''));
    let rows='';
    sorted.forEach(d=>{
      const pct = totalExposure>0?(d.bet_size/totalExposure*100).toFixed(1):0;
      const barW = Math.min(100, parseFloat(pct));
      rows+=`<tr>
        <td>${d.time?.slice(5)||'?'}</td>
        <td title="${d.league||''}">${d.match||'?'} <span class="muted" style="font-size:10px">${d.league||''}</span></td>
        <td class="num">${d.score||'-'}</td>
        <td>${d.bet_type||''} ${d.pick||''}</td>
        <td class="num">${d.handicap!=null?(d.handicap>=0?'+':'')+d.handicap.toFixed(2):''}</td>
        <td class="num">@${d.odds||''}</td>
        <td class="num money">¥${(d.bet_size||0).toLocaleString(undefined,{maximumFractionDigits:0})}</td>
        <td><span class="bar-wrap"><span class="bar-fill" style="width:${barW}%"></span></span>${pct}%</td>
        <td>${isPending?icn(null):(d.profit>0?'<span class="win">✅</span>':d.profit<0?'<span class="lose">❌</span>':'<span class="push">➖</span>')}</td>
        <td>${isPending?pnlCell(null):pnlCell(d.profit)}</td>
      </tr>`;
    });
    return `<table><thead><tr><th>日期</th><th>比赛</th><th>比分</th><th>类型</th><th>盘口</th><th>赔率</th><th class="money">金额</th><th>仓位</th><th></th><th>盈亏</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  const chartHtml = curve.length>=2 ? `<div class="chart-wrap">${drawCurve(curve, 400, 80)}</div>` : '';

  const pendHtml = pend.length ? `<div class="section-label">⏳ 未结算 · ${pend.length}单${pendingTotal>0?` · 注金 <span class="money">¥${pendingTotal.toLocaleString(undefined,{maximumFractionDigits:0})}</span>`:''}</div>${renderTable(pend,true)}` : '';
  const settledHtml = settled.length ? `<div class="section-label">✅ 已结算 · ${total}单 · 命中${hitRate}% · PnL <span class="${pnl>0?'win':pnl<0?'lose':'push'} money">${pnl>=0?'+':''}${pnl.toFixed(0)}</span></div>${renderTable(settled,false)}` : '';

  agentStats.push({agent:a, yRoi, yPnl, yBet, yN:ySettled.length, wRoi, wPnl, wBet, wN:wSettled.length});
  html+=`<div class="card-wrap" data-agent="${a}"><div class="card">
    <div class="card-head">
      <h2>${a}</h2>
      <div class="nums">
        <div class="cap"><span class="money">¥${cap.toLocaleString(undefined,{maximumFractionDigits:0})}</span>
          <span class="${pnl>0?'win':pnl<0?'lose':'push'}" style="font-size:13px"> PnL <span class="money">${pnl>=0?'+':''}${pnl.toFixed(0)}</span></span>
          ${pendingTotal>0?`<span class="money" style="font-size:12px;color:#8b949e"> · 敞口 ¥${totalExposure.toLocaleString(undefined,{maximumFractionDigits:0})}</span>`:''}
        </div>
        <div class="meta">${total+pend.length}单 · 命中${hitRate}% · ROI <span class="money">${roi}%</span>${yRoiHtml}${pend.length>0?` · <span class="pend">⏳${pend.length}待定</span>`:''}</div>
      </div>
    </div>
    ${chartHtml}
    <div class="card-body">${pendHtml}${settledHtml || '<div class="empty">暂无订单</div>'}</div>
  </div></div>`;
});

document.getElementById('grid').innerHTML = html || '<p class="empty">暂无数据</p>';



// ── 7.11 累计排名 ──
function buildTotalRanking(){
  const CUTOFF='2026-07-11';
  const orders=(EMBED.orders||[]).filter(o=>(o.settled_at||'')>=CUTOFF||(o.time||'').slice(0,10)>=CUTOFF);
  const byAgent={};
  orders.forEach(o=>{
    const a=o.agent||'?';
    if(!byAgent[a]) byAgent[a]={pnl:0,bet:0,n:0,w:0,push:0};
    byAgent[a].pnl+=o.profit||0;
    byAgent[a].bet+=o.bet_size||0;
    byAgent[a].n++;
    if(o.hit===true) byAgent[a].w++;
    if(o.hit===null) byAgent[a].push=(byAgent[a].push||0)+1;
  });
  // 回撤 from curves
  const curves=EMBED.curves||{};
  function calcMDD(pts){
    if(!pts||pts.length<2) return 0;
    let peak=pts[0].capital,mdd=0;
    for(let i=1;i<pts.length;i++){
      const c=pts[i].capital;
      if(c>peak) peak=c;
      const dd=(peak-c)/peak*100;
      if(dd>mdd) mdd=dd;
    }
    return mdd;
  }
  const agents=Object.keys(byAgent).sort();
  let tPnl=0,tBet=0,tN=0,tW=0;
  let tPush=0; agents.forEach(a=>{const d=byAgent[a];tPnl+=d.pnl;tBet+=d.bet;tN+=d.n;tW+=d.w;tPush+=(d.push||0);});
  const tRoi=(tBet>0?(tPnl/tBet*100).toFixed(1):'0.0');
  const tDecisions=tN-tPush; const tWr=(tDecisions>0?(tW/tDecisions*100).toFixed(1):'0.0');
  // 组合回撤: 合成总曲线
  const dateCap={};
  for(const [an,pts] of Object.entries(curves)){
    pts.forEach(p=>{if(p.date>=CUTOFF) dateCap[p.date]=(dateCap[p.date]||0)+p.capital;});
  }
  const totalPts=Object.entries(dateCap).sort((a,b)=>a[0].localeCompare(b[0])).map(([d,c])=>({date:d,capital:c}));
  const totalMDD=calcMDD(totalPts);
  const cls=(v)=>v>0?'win':v<0?'lose':'push';
  const money=(v)=>'¥'+Math.round(v).toLocaleString();
  const rows=[...agents].sort((a,b)=>(byAgent[b].pnl/byAgent[b].bet||0)-(byAgent[a].pnl/byAgent[a].bet||0));
  let t=`<div class="rank-title">📊 累计统计 · 7.11起 · ${tN}单</div>`;
  t+=`<table class="rank-table"><thead><tr><th class="rk">#</th><th>狗</th><th class="num">ROI</th><th class="num">盈亏</th><th class="num">流水</th><th class="num">单</th><th class="num">胜率</th><th class="num">最大回撤</th></tr></thead><tbody>`;
  let rank=0;
  rows.forEach(a=>{
    const d=byAgent[a],r=(d.bet>0?(d.pnl/d.bet*100).toFixed(1):'0.0');
    const decisions=d.n-(d.push||0); const wr=(decisions>0?(d.w/decisions*100).toFixed(1):'0.0');
    const curve=(curves[a]||[]).filter(p=>p.date>=CUTOFF);
    const mdd=calcMDD(curve);
    rank++;
    t+=`<tr><td class="rk">${rank}</td><td>${a}</td>`+
       `<td class="num ${cls(parseFloat(r))}">${parseFloat(r)>=0?'+':''}${r}%</td>`+
       `<td class="num ${cls(d.pnl)} money">${d.pnl>=0?'+':''}${Math.round(d.pnl).toLocaleString()}</td>`+
       `<td class="num money">${money(d.bet)}</td>`+
       `<td class="num">${d.n}</td>`+
       `<td class="num">${wr}%</td>`+
       `<td class="num">${mdd.toFixed(1)}%</td></tr>`;
  });
  t+=`<tr style="font-weight:700;border-top:2px solid #30363d"><td class="rk">-</td><td>📊 合计</td>`+
     `<td class="num ${cls(parseFloat(tRoi))}">${parseFloat(tRoi)>=0?'+':''}${tRoi}%</td>`+
     `<td class="num ${cls(tPnl)} money">${tPnl>=0?'+':''}${Math.round(tPnl).toLocaleString()}</td>`+
     `<td class="num money">${money(tBet)}</td>`+
     `<td class="num">${tN}</td>`+
     `<td class="num">${tWr}%</td>`+
     `<td class="num">${totalMDD.toFixed(1)}%</td></tr>`;
  t+=`</tbody></table>`;
  return t;
}

// ── 单狗过滤按钮 ──
let rankMode=null; // 'day' | 'week' | null
const rankBtn=document.getElementById('rankBtn');
const rankPanel=document.getElementById('ranking');
const grid=document.getElementById('grid');
const filterBar=document.getElementById('filters');
let curFilter='__all';

let fHtml=`<button class="fbtn on" data-f="__all">全部</button>`;
agents.forEach(a=> fHtml+=`<button class="fbtn" data-f="${a}">${a}</button>`);
filterBar.innerHTML=fHtml;

function applyFilter(f){
  curFilter=f;
  document.querySelectorAll('#filters .fbtn').forEach(x=>x.classList.toggle('on', x.dataset.f===f));
  document.querySelectorAll('.card-wrap').forEach(w=>{
    w.style.display=(f==='__all'||w.dataset.agent===f)?'':'none';
  });
  document.body.classList.toggle('single-agent', f!=='__all');
}
filterBar.addEventListener('click', e=>{
  const b=e.target.closest('.fbtn'); if(!b) return;
  if(rankMode) toggleRank(rankMode);   // 从排名模式点过滤 → 关闭排名回到卡片视图
  applyFilter(b.dataset.f);
});

// ── 排名模式 ──
function buildRanking(mode){
  const isDay = mode==='day';
  const label = isDay ? '昨日' : '本周';
  const period = isDay ? yesterdayFD.slice(5) : `${weekStartFD.slice(5)}~${yesterdayFD.slice(5)}`;
  const rows=[...agentStats].sort((a,b)=>{
    const aV=isDay?a.yRoi:a.wRoi, bV=isDay?b.yRoi:b.wRoi;
    if(aV==null && bV==null) return 0;
    if(aV==null) return 1;
    if(bV==null) return -1;
    return bV-aV;
  });
  let t=`<div class="rank-title">🏆 ${label}排名(${period}) · 按 ROI 降序</div>`;
  t+=`<table class="rank-table"><thead><tr><th class="rk">#</th><th>狗</th><th class="num">${label}ROI</th><th class="num">盈亏</th><th class="num">注金</th><th class="num">单</th></tr></thead><tbody>`;
  let rank=0;
  rows.forEach(s=>{
    const roi=isDay?s.yRoi:s.wRoi, pnl=isDay?s.yPnl:s.wPnl, bet=isDay?s.yBet:s.wBet, n=isDay?s.yN:s.wN;
    if(roi==null){
      t+=`<tr><td class="rk">–</td><td>${s.agent}</td><td colspan="4" class="muted">${label}无单</td></tr>`;
    }else{
      rank++;
      const cls=roi>0?'win':roi<0?'lose':'push';
      t+=`<tr><td class="rk">${rank}</td><td>${s.agent}</td>`+
         `<td class="num ${cls}">${roi>=0?'+':''}${roi.toFixed(1)}%</td>`+
         `<td class="num ${cls} money">${pnl>=0?'+':''}${pnl.toFixed(0)}</td>`+
         `<td class="num money">${bet.toFixed(0)}</td>`+
         `<td class="num">${n}</td></tr>`;
    }
  });
  t+=`</tbody></table>`;
  return t;
}
function toggleRank(mode){
  const on = (mode===rankMode) ? null : mode;
  rankMode=on;
  document.getElementById('rankDayBtn').classList.toggle('on', rankMode==='day');
  document.getElementById('rankWeekBtn').classList.toggle('on', rankMode==='week');
  document.getElementById('rankTotalBtn').classList.toggle('on', rankMode==='total');
  grid.style.display=rankMode?'none':'';
  rankPanel.style.display=rankMode?'':'none';
  if(rankMode==='total') rankPanel.innerHTML=buildTotalRanking();
  else if(rankMode) rankPanel.innerHTML=buildRanking(rankMode);
}
document.getElementById('rankDayBtn').addEventListener('click', ()=>toggleRank('day'));
document.getElementById('rankWeekBtn').addEventListener('click', ()=>toggleRank('week'));
document.getElementById('rankTotalBtn').addEventListener('click', ()=>toggleRank('total'));
</script>
