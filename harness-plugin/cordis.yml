# ds-agents-lota-data 的挂载示例（composition）。
#
# 这不是可独立运行的脚本，而是给 Loader 的「插件行」清单：
#   每一行 = 一个插件，name 指向 npm 包名 / 本地插件路径。
# 把它并入你的 profile（或 agent preset 的 agent.cordis.yml）即可挂载。
#
# 注意（对齐 docs/bridge.md）：
#   - 数据只读工具不触网、不含密钥；固定流走「引擎桥」调本地 Python 引擎。
#   - cacheDir 指向缓存根目录；engineRoot 指向 Python 引擎（含 src/）。

- id: lota-data
  name: 'ds-agents-lota-data'
  config:
    # 本地缓存根目录（含 matches/ features/ tags/ predicts/ orders/）
    cacheDir: ./python-engine/data
    # Python 引擎根目录（桥会 python3 -m src.bridge）
    engineRoot: ./python-engine
